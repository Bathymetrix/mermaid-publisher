name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  geocsv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: Bathymetrix/mermaid-geocsv
          path: consumer
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      # The coordinated consumer must be available before this migration runs remotely.
      - run: python -m pip install ./consumer -r requirements/geocsv.txt
      - run: python -B -m unittest discover -s tests -v
